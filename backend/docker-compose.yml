services:
  postgres:
    image: postgres:17-alpine
    container_name: hyway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyway
      POSTGRES_PASSWORD: hyway_dev_password
      POSTGRES_DB: hyway
    ports:
      - "5432:5432"
    volumes:
      - hyway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyway -d hyway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hyway_postgres_data:
